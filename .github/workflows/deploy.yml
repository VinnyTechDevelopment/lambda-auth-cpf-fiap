name: Deploy lambda-auth-cpf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: Testes (Jest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: [src, src-authorizer]
    defaults:
      run:
        working-directory: ${{ matrix.lambda }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npx jest --coverage

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_lab_role_arn: ${{ secrets.LAB_ROLE_ARN }}
      TF_VAR_customer_jwt_secret: ${{ secrets.CUSTOMER_JWT_SECRET }}
      # Fase 4: authorizer aceita token de funcionário e a Lambda de CPF
      # consulta o os-service pelo endpoint interno (sem acesso ao RDS).
      TF_VAR_staff_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_internal_api_token: ${{ secrets.INTERNAL_API_TOKEN }}
      # NLB de cada microsserviço (vazios = rotas daquele serviço não criadas).
      TF_VAR_app_backend_domain: ${{ secrets.APP_BACKEND_DOMAIN }}
      TF_VAR_billing_backend_domain: ${{ secrets.BILLING_BACKEND_DOMAIN }}
      TF_VAR_execution_backend_domain: ${{ secrets.EXECUTION_BACKEND_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências da Lambda (auth_cpf)
        working-directory: src
        run: npm ci --production

      - name: Instalar dependências da Lambda (authorizer)
        working-directory: src-authorizer
        run: npm ci --production

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=lambda-auth-cpf/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: terraform apply -auto-approve
